<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Photos Maker</title>
<link rel="stylesheet" href="css/styles.css?v=20260815a">
</head>
<body>
<div id="app">
  <header id="header">
    <h1>Template Photos Maker</h1>
    <p class="subtitle">Susun, atur, dan cetak foto dalam layout A4 dengan rapi.</p>
  </header>

  <div id="main-layout">
    <div id="sidebar">
      <section id="settings-card" class="card">
        <div class="card-header">Ukuran &amp; Margin</div>
        <div class="card-body">
          <div class="settings-grid">
            <div class="setting-row">
              <label>Lebar</label>
              <input type="number" id="photo-width" class="input-num" value="4" step="0.1" min="0.5" max="30">
              <span class="unit">cm</span>

              <label>Tinggi</label>
              <input type="number" id="photo-height" class="input-num" value="6" step="0.1" min="0.5" max="30">
              <span class="unit">cm</span>

              <label>Min Margin</label>
              <input type="number" id="min-margin" class="input-num-sm" value="5" step="1" min="0" max="30">
              <span class="unit">mm</span>

              <label>Margin Atas</label>
              <input type="number" id="margin-atas" class="input-num-sm" value="6" step="1" min="0" max="50">
              <span class="unit">mm</span>
            </div>
            <hr class="divider">
            <div class="setting-row">
              <label class="checkbox-label">
                <input type="checkbox" id="show-border" checked>
                Border
              </label>
              <label>Tebal</label>
              <input type="number" id="border-width" class="input-num-sm" value="0.1" step="0.001" min="0" max="2">
              <span class="unit">mm</span>
              <label class="checkbox-label">
                <input type="checkbox" id="border-hairline">
                Hairline
              </label>

              <label class="checkbox-label">
                <input type="checkbox" id="show-cutlines" checked>
                Garis Potong
              </label>

              <label class="checkbox-label">
                <input type="checkbox" id="auto-rotate" checked>
                Auto-rotate
              </label>

              <label>Mode</label>
              <select id="fit-mode" class="input-select-sm">
                <option value="fill">fill</option>
                <option value="fit">fit</option>
                <option value="stretch">stretch</option>
              </select>
              <span class="hint">fill=potong&nbsp; fit=muat&nbsp; stretch=tarik</span>

              <label class="checkbox-label">
                <input type="checkbox" id="tile-enable">
                Tile (bagi halaman rata)
              </label>
              <span id="tile-inputs">
                <label>Baris</label>
                <input type="number" id="tile-rows" class="input-num-sm" value="2" min="1" max="12" step="1">
                <label>Kolom</label>
                <input type="number" id="tile-cols" class="input-num-sm" value="2" min="1" max="12" step="1">
              </span>
              <span class="hint">canvas dibagi rata sesuai Baris × Kolom</span>

              <label class="checkbox-label">
                <input type="checkbox" id="show-white-border" checked>
                Border Putih
              </label>
            </div>
            <div class="setting-row">
              <label>Atas</label>
              <input type="number" id="wb-top" class="input-num-sm" value="1.5" step="0.1" min="0" max="5">
              <span class="unit">mm</span>

              <label>Bawah</label>
              <input type="number" id="wb-bottom" class="input-num-sm" value="1.5" step="0.1" min="0" max="5">
              <span class="unit">mm</span>

              <label>Kiri</label>
              <input type="number" id="wb-left" class="input-num-sm" value="1.5" step="0.1" min="0" max="5">
              <span class="unit">mm</span>

              <label>Kanan</label>
              <input type="number" id="wb-right" class="input-num-sm" value="1.5" step="0.1" min="0" max="5">
              <span class="unit">mm</span>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div id="content-area">
      <div id="info-strip">
        <span id="info-label">Belum ada foto</span>
        <div id="page-nav" class="hidden">
          <button id="btn-page-prev" class="btn btn-sm btn-secondary" title="Halaman sebelumnya">&larr;</button>
          <span id="page-label">1 / 1</span>
          <button id="btn-page-next" class="btn btn-sm btn-secondary" title="Halaman selanjutnya">&rarr;</button>
        </div>
      </div>

      <div id="right-panel">
        <div id="preview-header">
          <span class="preview-title">Preview</span>
          <div id="zoom-controls">
            <span id="zoom-label">100%</span>
            <button id="btn-zoom-in" class="btn btn-sm btn-secondary">+</button>
            <button id="btn-zoom-out" class="btn btn-sm btn-secondary">&minus;</button>
            <button id="btn-zoom-reset" class="btn btn-sm btn-secondary">1:1</button>
          </div>
        </div>
        <div id="preview-border">
          <canvas id="preview-canvas"></canvas>
        </div>
      </div>

      <div id="action-bar">
        <button id="btn-page-position" class="btn btn-secondary">Posisi Halaman...</button>
        <button id="btn-orientation" class="btn btn-secondary">Orientasi: Potret</button>
        <button id="btn-print" class="btn btn-primary">Print</button>
        <button id="btn-export-png" class="btn btn-success">Export PNG</button>
      </div>

      <div id="status-bar">
        <span id="status-text">&#x25CF; Siap</span>
      </div>
    </div>

    <div id="right-sidebar">
      <section id="preset-card" class="card">
        <div class="card-header">Preset</div>
        <div class="card-body row">
          <select id="preset-combo" class="input-select"></select>
          <button id="btn-save-preset" class="btn btn-outline-primary">Simpan Preset</button>
          <button id="btn-delete-preset" class="btn btn-outline-danger">Hapus</button>
        </div>
      </section>

      <div id="left-panel">
        <div id="toolbar" class="row">
          <button id="btn-add" class="btn btn-primary">+ Tambah Foto</button>
          <button id="btn-paste" class="btn btn-secondary">Paste (Ctrl+V)</button>
          <button id="btn-remove" class="btn btn-warning-outline">Hapus</button>
          <button id="btn-clear" class="btn btn-danger-outline">Hapus Semua</button>
          <button id="btn-move-up" class="btn btn-sm btn-secondary" title="Naik">&uarr;</button>
          <button id="btn-move-down" class="btn btn-sm btn-secondary" title="Turun">&darr;</button>
          <button id="btn-fill" class="btn btn-outline-primary">Isi Semua Slot</button>
        </div>
        <div id="list-container">
          <div id="photo-list"></div>
          <div id="list-placeholder">Drag &amp; drop foto di sini<br>atau klik + Tambah Foto</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="context-menu" class="hidden">
  <button data-action="set-size">Set Ukuran...</button>
  <hr>
  <button data-action="rotate-cw">Rotate 90&deg; CW</button>
  <button data-action="rotate-ccw">Rotate 90&deg; CCW</button>
  <button data-action="rotate-180">Rotate 180&deg;</button>
  <hr>
  <button data-action="flip-h">Flip Horizontal</button>
  <button data-action="flip-v">Flip Vertical</button>
  <button data-action="flip-ratio">Flip Rasio</button>
  <hr>
  <button data-action="duplicate">Duplikat...</button>
  <hr>
  <button data-action="filter-none" data-label="Warna (Normal)">Warna (Normal)</button>
  <button data-action="filter-gray" data-label="Grayscale">Grayscale</button>
  <button data-action="filter-bw" data-label="Black &amp; White">Black &amp; White</button>
</div>

<dialog id="dialog-overlay" class="hidden">
  <div id="dialog-box">
    <div id="dialog-content"></div>
  </div>
</dialog>

<input type="file" id="file-input" multiple accept="image/*" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="js/app.js?v=20260815a"></script>
</body>
</html>
